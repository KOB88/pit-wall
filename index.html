function pitSecs(duration) {
  if (duration.includes(":")) {
    const [m, rest] = duration.split(":");
    return parseInt(m, 10) * 60 + parseFloat(rest);
  }
  return parseFloat(duration);
}

// ---------- Analysis 2: fantasy top 3 ----------
function fantasyPoints(finish, grid, status, fastestLap) {
  const racePts = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
  const finished = status === "Finished" || status.startsWith("+");
  if (!finished) return -20;
  let total = 0;
  if (finish >= 1 && finish <= 10) total += racePts[finish - 1];
  if (grid >= 1 && grid <= 10) total += 11 - grid;
  total += grid - finish;
  if (fastestLap) total += 10;
  return total;
}

async function fantasyTop() {
  const last = await getLatestRound();
  const { allResults, allSprints, allQuali } = await loadModelData(last);
  const allPits = await loadAllPitStops(last);
  const drivers = buildDriverData(allResults, allSprints, allQuali, last);

  const dTot = new Map(), tTot = new Map();
  for (const [n, d] of drivers)
    for (const rd of d.rounds) {
      dTot.set(n, (dTot.get(n) ?? 0) + rd.fpts);
      tTot.set(rd.rteam, (tTot.get(rd.rteam) ?? 0) + rd.fpts);
    }

  // fastest pit stop of each race: +10/+5/+3 to the three quickest teams (best stop per team)
  for (let r = 0; r < last; r++) {
    const teamOf = new Map();
    for (const res of allResults[r]) teamOf.set(res.Driver.driverId, res.Constructor.name);
    const ranked = allPits[r]
      .map(s => ({ team: teamOf.get(s.driverId), secs: pitSecs(s.duration) }))
      .filter(x => x.team && x.secs <= 120)
      .sort((a, b) => a.secs - b.secs);
    const bonus = [10, 5, 3], seen = new Set();
    for (const st of ranked) {
      if (seen.has(st.team)) continue;
      seen.add(st.team);
      tTot.set(st.team, (tTot.get(st.team) ?? 0) + bonus[seen.size - 1]);
      if (seen.size === 3) break;
    }
  }

  const top = m => [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
  title("Top 3 drivers · fantasy pts");
  top(dTot).forEach(([n, v], i) => rowHTML(i + 1, dn(n), Math.round(v) + " pts"));
  title("Top 3 teams · fantasy pts");
  top(tTot).forEach(([n, v], i) => rowHTML(i + 1, n, Math.round(v) + " pts"));
  note("Includes overtake (≈ positions gained), Q2/Q3, sprint, and fastest-pit-stop (+10/+5/+3, teams only) "
    + "bonuses. Driver-of-the-day and true on-track overtake counts aren't in the data.");
}

// ---------- Analysis 3: pit stops ----------
async function pitStops() {
  const last = await getLatestRound();
  const idName = new Map(), idTeam = new Map();
  const total = new Map(), count = new Map();
  let excluded = 0;

  for (const results of await loadAllResults(last)) {
    for (const res of results) {
      idName.set(res.Driver.driverId, res.Driver.familyName);
      idTeam.set(res.Driver.driverId, res.Constructor.name);
      noteFlag(res.Driver);
    }
  }
  for (const stops of await loadAllPitStops(last)) {
    for (const s of stops) {
      const secs = pitSecs(s.duration);
      if (secs > 120) { excluded++; continue; } // red-flag stoppages get logged as 15+ min "stops"
      total.set(s.driverId, (total.get(s.driverId) ?? 0) + secs);
      count.set(s.driverId, (count.get(s.driverId) ?? 0) + 1);
    }
  }

  const driverAvg = new Map(), teamTotal = new Map(), teamCount = new Map();
  for (const id of total.keys()) {
    driverAvg.set(idName.get(id) ?? id, total.get(id) / count.get(id));
    const t = idTeam.get(id) ?? "Unknown";
    teamTotal.set(t, (teamTotal.get(t) ?? 0) + total.get(id));
    teamCount.set(t, (teamCount.get(t) ?? 0) + count.get(id));
  }
  const teamAvg = new Map();
  for (const t of teamTotal.keys()) teamAvg.set(t, teamTotal.get(t) / teamCount.get(t));

  const fastest = m => [...m.entries()].sort((a, b) => a[1] - b[1]).slice(0, 5);
  title("Fastest avg pit stop · drivers");
  fastest(driverAvg).forEach(([n, v], i) => rowHTML(i + 1, dn(n), v.toFixed(3) + "s"));
  title("Fastest avg pit stop · teams");
  fastest(teamAvg).forEach(([n, v], i) => rowHTML(i + 1, n, v.toFixed(3) + "s"));
  note("Durations are total pit lane time, not stationary time."
    + (excluded ? ` Excluded ${excluded} stops over 120s (red-flag stoppages).` : ""));
}

// ---------- Analysis 4: overtake trend ----------
async function overtakes() {
  const last = await getLatestRound();
  const perRound = [];

  for (const results of await loadAllResults(last)) {
    let sum = 0;
    for (const res of results) {
      const grid = parseInt(res.grid, 10) || 25;
      const finish = parseInt(res.position, 10) || 25;
      if (grid > finish) sum += grid - finish;
    }
    perRound.push(sum);
  }

  title("Positions gained per round");
  perRound.forEach((v, i) => rowHTML("R" + (i + 1), "", v));
  const first = perRound[0], lastV = perRound[perRound.length - 1];
  if (first > 0) {
    const change = ((lastV - first) / first) * 100;
    title("Round 1 → latest");
    rowHTML("", "Change in positions gained", pct(change), change >= 0 ? "up" : "down");
  }
  note("Overtakes approximated as grid position minus finish position.");
}

// ---------- prediction model (fantasy points) ----------
// qualiPts = fantasy pts per 1% gap-to-pole improvement; mechW = how fully a mechanical
// DNF counts against future reliability (1 = same as a crash, 0.5 = "the team will fix it")
const DEFAULT_TUNE = { decay: 0.85, shrinkK: 3, qualiPts: 2, mechW: 1, gridW: 0.4 };
function tuneParams() {
  try { return { ...DEFAULT_TUNE, ...JSON.parse(localStorage.getItem("pw-tune") ?? "{}") }; }
  catch { return { ...DEFAULT_TUNE }; }
}

function isFinished(status) { return status === "Finished" || status.startsWith("+"); }

// crashes follow the driver; everything else (engine, gearbox, hydraulics…) follows the car
const CRASH_STATUS = new Set(["Accident", "Collision", "Spun off", "Collision damage"]);

function qTime(t) { // "1:29.708" or "89.708" -> seconds
  if (!t) return null;
  const p = t.split(":");
  const s = p.length === 2 ? parseInt(p[0], 10) * 60 + parseFloat(p[1]) : parseFloat(p[0]);
  return isNaN(s) ? null : s;
}

// per-driver round history: championship pts, fantasy pts (race + overtake + quali + sprint),
// quali gap-to-pole %, and whether a DNF was the driver's own doing
function buildDriverData(allResults, allSprints, allQuali, upto) {
  const drivers = new Map();
  for (let r = 0; r < upto; r++) {
    const sprintPts = new Map(), sprintF = new Map(), qualiB = new Map(), qBest = new Map();
    for (const sr of allSprints[r]) {
      const n = sr.Driver.familyName;
      const g = parseInt(sr.grid, 10) || 25, f = parseInt(sr.position, 10) || 25;
      sprintPts.set(n, parseFloat(sr.points) || 0);
      sprintF.set(n, (parseFloat(sr.points) || 0) + (isFinished(sr.status) ? Math.max(0, g - f) : -20));
    }
    for (const q of allQuali[r]) {
      qualiB.set(q.Driver.familyName, (q.Q2 ? 1 : 0) + (q.Q3 ? 2 : 0));
      const best = Math.min(...[q.Q1, q.Q2, q.Q3].map(qTime).filter(t => t != null));
      if (isFinite(best)) qBest.set(q.Driver.familyName, best);
    }
    // gap to pole in % — a far finer pace signal than grid position
    const pole = Math.min(...qBest.values());
    const qualiGap = new Map();
    if (isFinite(pole)) for (const [n, t] of qBest) qualiGap.set(n, ((t - pole) / pole) * 100);
    for (const res of allResults[r]) {
      const n = res.Driver.familyName;
      noteFlag(res.Driver);
      if (!drivers.has(n)) drivers.set(n, { rounds: [], team: "" });
      const d = drivers.get(n);
      d.team = res.Constructor.name;
      const grid = parseInt(res.grid, 10) || 25, fin = parseInt(res.position, 10) || 25;
      let f = fantasyPoints(fin, grid, res.status, res.FastestLap?.rank === "1");
      if (isFinished(res.status) && grid > fin) f += grid - fin; // overtake bonus
      d.rounds.push({
        age: upto - 1 - r, // 0 = most recent round
        pts: (parseFloat(res.points) || 0) + (sprintPts.get(n) ?? 0),
        fpts: f + (qualiB.get(n) ?? 0) + (sprintF.get(n) ?? 0),
        finished: isFinished(res.status),
        crash: !isFinished(res.status) && CRASH_STATUS.has(res.status),
        qgap: qualiGap.get(n) ?? null,
        grid, // starting position — the strongest single predictor of a race's fantasy points
        rteam: res.Constructor.name,
      });
    }
  }
  return drivers;
}

function predictDrivers(drivers, opts, gridMap) {
  const { decay, shrinkK, qualiPts, mechW, gridW } = { ...tuneParams(), ...opts };
  const preds = new Map();

  // grid -> expected fantasy points curve, learned from the training rounds.
  // Only used when we know the upcoming grid (gridMap) — grid position is the single
  // strongest predictor of a race's points, so we blend it into each driver's form.
  let curve = null;
  if (gridW > 0 && gridMap) {
    const byGrid = new Map(); let all = 0, allN = 0;
    for (const d of drivers.values()) for (const rd of d.rounds) {
      if (rd.grid == null) continue;
      (byGrid.get(rd.grid) || byGrid.set(rd.grid, []).get(rd.grid)).push(rd.fpts);
      all += rd.fpts; allN++;
    }
    const avg = allN ? all / allN : 0;
    curve = g => { const a = byGrid.get(g); return a && a.length >= 2 ? a.reduce((x, y) => x + y, 0) / a.length : avg; };
  }

  for (const [name, d] of drivers) {
    // pace: recency-weighted fantasy points, DNF rounds excluded (a blown engine isn't slow pace)
    let wSum = 0, pSum = 0, fin = 0, crash = 0, mech = 0;
    for (const rd of d.rounds) {
      if (rd.finished) {
        const w = Math.pow(decay, rd.age);
        wSum += w; pSum += w * rd.fpts; fin++;
      } else rd.crash ? crash++ : mech++;
    }
    // quali trend in % gap-to-pole: season average minus recency-weighted (+ = getting faster)
    let qw = 0, qs = 0, qn = 0, qTot = 0;
    for (const rd of d.rounds) if (rd.qgap != null) {
      const w = Math.pow(decay, rd.age);
      qw += w; qs += w * rd.qgap; qn++; qTot += rd.qgap;
    }
    // floor/ceiling: average of the 3 worst and 3 best fantasy rounds
    const sorted = d.rounds.map(rd => rd.fpts).sort((a, b) => a - b);
    const k = Math.min(3, sorted.length);
    const floor = sorted.slice(0, k).reduce((a, b) => a + b, 0) / k;
    const ceil = sorted.slice(-k).reduce((a, b) => a + b, 0) / k;
    preds.set(name, {
      ewma: wSum > 0 ? pSum / wSum : 0,
      qualiTrend: qn >= 2 ? qTot / qn - qs / qw : 0,
      fin, crash, mech, floor, ceil, n: d.rounds.length, team: d.team,
    });
  }
  // shrink low-sample drivers toward the field average, then price in DNF risk:
  // expected fantasy = P(finish) x pace + P(DNF) x (-20). Crashes always count fully against
  // the driver; how much a mechanical DNF predicts future ones is tuned (mechW).
  const vals = [...preds.values()];
  const fieldAvg = vals.reduce((a, p) => a + p.ewma, 0) / (vals.length || 1);
  for (const [name, p] of preds) {
    const w = p.fin / (p.fin + shrinkK);
    p.pace = w * p.ewma + (1 - w) * fieldAvg;
    p.reliability = p.n ? Math.max(0, 1 - (p.crash + mechW * p.mech) / p.n) : 0;
    p.pred = p.reliability * (p.pace + qualiPts * p.qualiTrend) + (1 - p.reliability) * -20;
    // blend in the grid-implied points when we know where the driver starts
    if (curve && gridMap && gridMap.has(name)) {
      p.gridPts = curve(gridMap.get(name));
      p.pred = (1 - gridW) * p.pred + gridW * p.gridPts;
    }
    p.norm = p.pred;
  }
  return preds;
}

function teammateDeltas(drivers) {
  const totals = new Map(), byTeam = new Map();
  for (const [name, d] of drivers) {
    totals.set(name, d.rounds.reduce((a, rd) => a + rd.fpts, 0));
    if (!byTeam.has(d.team)) byTeam.set(d.team, []);
    byTeam.get(d.team).push(name);
  }
  const deltas = new Map();
  for (const names of byTeam.values())
    for (const n of names) {
      const others = names.filter(x => x !== n);
      if (others.length) deltas.set(n, totals.get(n) - Math.max(...others.map(o => totals.get(o))));
    }
  return deltas;
}

async function loadModelData(last) {
  const allResults = await loadAllResults(last);
  const allSprints = await loadAllSprints(last);
  const allQuali = await loadAllQualifying(last);
  return { allResults, allSprints, allQuali };
}

// keep only drivers who raced the most recent round — no predictions for departed drivers
function activeOnly(drivers, latestResults) {
  const active = new Set(latestResults.map(res => res.Driver.familyName));
  for (const name of [...drivers.keys()]) if (!active.has(name)) drivers.delete(name);
  return drivers;
}

const OPENF1 = "https://api.openf1.org/v1";

// which completed rounds were wet? (OpenF1 rainfall flag; race sessions in date order = round order)
async function loadWetRounds(last) {
  const wet = new Set();
  try {
    const sched = await fetchCached(`${API}/current.json?limit=30`);
    const sessions = [...await fetchCached(`${OPENF1}/sessions?year=${sched.MRData.RaceTable.season}&session_name=Race`)]
      .sort((a, b) => a.date_start.localeCompare(b.date_start));
    const urls = sessions.slice(0, last).map(s => `${OPENF1}/weather?session_key=${s.session_key}&rainfall=1`);
    const rains = await fetchAll(urls, "Checking historic rain", true); // 404 = dry race
    rains.forEach((rows, i) => { if (Array.isArray(rows) && rows.length) wet.add(i + 1); });
  } catch {} // OpenF1 down or no data yet — forecast falls back to field compression
  return wet;
}

const HISTORY_YEARS = 5;   // seasons of track history to load
const YEAR_DECAY = 0.8;    // last year's race counts more than five years ago
const TRACK_WEIGHT = 0.25; // max share of the prediction that track record can claim

// a driver's record at one circuit over the past seasons: wins, podiums, weighted avg points
async function loadTrackRecord(circuitId, season) {
  const urls = [];
  for (let y = season - HISTORY_YEARS; y < season; y++)
    urls.push(`${API}/${y}/circuits/${circuitId}/results.json?limit=60`);
  const jsons = await fetchAll(urls, "Fetching track history");
  const rec = new Map();
  jsons.forEach((j, i) => {
    const w = Math.pow(YEAR_DECAY, HISTORY_YEARS - 1 - i); // i=0 is the oldest season
    for (const race of j.MRData.RaceTable.Races ?? [])
      for (const res of race.Results ?? []) {
        const n = res.Driver.familyName;
        noteFlag(res.Driver);
        if (!rec.has(n)) rec.set(n, { pSum: 0, wSum: 0, races: 0, wins: 0, podiums: 0 });
        const r = rec.get(n);
        const pos = parseInt(res.position, 10) || 25;
        const grid = parseInt(res.grid, 10) || 25;
        let f = fantasyPoints(pos, grid, res.status, res.FastestLap?.rank === "1");
        if (isFinished(res.status) && grid > pos) f += grid - pos;
        r.pSum += w * f; // fantasy pts, same currency as the model
        r.wSum += w;
        r.races++;
        if (pos === 1) r.wins++;
        if (pos <= 3) r.podiums++;
      }
  });
  for (const r of rec.values()) r.avg = r.wSum ? r.pSum / r.wSum : 0;
  return rec;
}

// wet skill: a driver's wet-vs-dry points-per-round delta, shrunk by wet sample size
function wetSkillDeltas(drivers, wetRounds, upto) {
  const deltas = new Map();
  if (!wetRounds.size) return deltas;
  for (const [name, d] of drivers) {
    let wSum = 0, wN = 0, dSum = 0, dN = 0;
    for (const rd of d.rounds) {
      if (wetRounds.has(upto - rd.age)) { wSum += rd.fpts; wN++; }
      else { dSum += rd.fpts; dN++; }
    }
    if (wN && dN) deltas.set(name, (wSum / wN - dSum / dN) * (wN / (wN + 2)));
  }
  return deltas;
}

// ---------- Analysis 6: form predictor ----------
async function formPredictor() {
  const last = await getLatestRound();
  const { allResults, allSprints, allQuali } = await loadModelData(last);
  const drivers = activeOnly(buildDriverData(allResults, allSprints, allQuali, last), allResults[last - 1]);
  const preds = predictDrivers(drivers);
  const deltas = teammateDeltas(drivers);

  title("Predicted fantasy pts · next round");
  [...preds.entries()].sort((a, b) => b[1].norm - a[1].norm).slice(0, 10).forEach(([n, p], i) => {
    const dl = deltas.get(n) ?? 0;
    rowHTML(i + 1, dn(n), p.norm.toFixed(1) + " pts", "",
      `pace ${p.pace.toFixed(1)} · quali trend ${p.qualiTrend >= 0 ? "+" : ""}${p.qualiTrend.toFixed(2)}%`
      + ` · reliability ${Math.round(p.reliability * 100)}%`
      + (p.crash || p.mech ? ` (${p.crash} crash / ${p.mech} mech)` : "")
      + ` · range ${Math.round(p.floor)}…${Math.round(p.ceil)} · vs teammate ${dl >= 0 ? "+" : ""}${Math.round(dl)} pts`);
  });

  // momentum: avg % increase relative to the driver's own points base
  const byMomentum = [], skipped = [];
  for (const [name, d] of drivers) {
    let cum = 0;
    const s = d.rounds.map(rd => cum += rd.pts);
    const pcts = [];
    for (let i = 1; i < s.length; i++)
      if (s[i - 1] > 0) pcts.push(((s[i] - s[i - 1]) / s[i - 1]) * 100);
    if (pcts.length < 3) { skipped.push(`${name} — fewer than 3 scoring rounds`); continue; }
    byMomentum.push({ name, avg: pcts.reduce((a, b) => a + b, 0) / pcts.length, now: cum });
  }
  byMomentum.sort((a, b) => b.avg - a.avg);

  title("Momentum · avg % increase per round");
  byMomentum.slice(0, 10).forEach((d, i) => {
    const rounds = (drivers.get(d.name)?.rounds ?? []).map(rd => ({ r: last - rd.age, pts: Math.round(rd.fpts) }));
    const total = rounds.reduce((a, x) => a + x.pts, 0);
    out.insertAdjacentHTML("beforeend",
      `<details class="row"><summary><span class="pos">${i + 1}</span>`
      + `<span class="name">${dn(d.name)}<span class="detail">now: ${Math.round(d.now)} pts · fantasy total: ${total}</span></span>`
      + `<span class="val ${d.avg > 0 ? "up" : ""}">${pct(d.avg)}/rd</span></summary>`
      + `<div class="rounds-wrap">${sparkline(rounds.map(x => x.pts))}`
      + `<div class="rounds">${rounds.map(x =>
          `<span>R${x.r}<b class="${x.pts < 0 ? "neg" : ""}">${x.pts}</b></span>`).join("")}</div></div></details>`);
  });
  note("Tap a driver for their fantasy points per round — sparkline and breakdown, quali and sprint bonuses included.");
  if (skipped.length) { title("Not enough data for % trend"); skipped.forEach(s => note(s)); }

  const t = tuneParams();
  note(`Model: recency-weighted (λ=${t.decay}) fantasy points on finished rounds, shrunk toward the field `
    + `average (k=${t.shrinkK}), adjusted by quali gap-to-pole trend (${t.qualiPts} pts per 1% gained). `
    + `DNF risk prices in the -20: crashes count fully against the driver, mechanical failures at `
    + `weight ${t.mechW} (tuned). Range = average of each driver's 3 worst / 3 best rounds.`);
}

// ---------- Analysis 7: race forecast ----------
async function raceForecast() {
  const last = await getLatestRound();
  const sched = await fetchCached(`${API}/current.json?limit=30`);
  const races = sched.MRData.RaceTable.Races;
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = races.filter(r => r.date > today).slice(0, 3);
  if (!upcoming.length) { note("Season complete — no upcoming races."); return; }

  setStatus("Fetching race-day weather…", true);
  const weather = [];
  for (const race of upcoming) {
    const { lat, long } = race.Circuit.Location;
    try {
      const w = await fetchCached(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${long}`
        + `&daily=precipitation_probability_max,precipitation_sum&timezone=auto`
        + `&start_date=${race.date}&end_date=${race.date}`);
      weather.push({ rain: w.daily.precipitation_probability_max[0], mm: w.daily.precipitation_sum[0] });
    } catch { weather.push(null); }
  }

  title("Upcoming races · race-day rain risk");
  upcoming.forEach((race, i) => {
    const w = weather[i], hasRain = w && w.rain != null;
    rowHTML("R" + race.round, countryFlag(race.Circuit.Location.country) + race.raceName,
      hasRain ? `${w.rain}% rain` : "beyond forecast",
      hasRain && w.rain >= 50 ? "down" : "",
      `${race.Circuit.circuitName} · ${race.date}`);
  });

  const next = upcoming[0], w0 = weather[0];
  const rainProb = w0?.rain != null ? w0.rain / 100 : 0;

  const { allResults, allSprints, allQuali } = await loadModelData(last);
  const drivers = activeOnly(buildDriverData(allResults, allSprints, allQuali, last), allResults[last - 1]);
  // once the next race has qualified, fold each driver's grid slot into the prediction
  let upGrid = new Map();
  try {
    const q = await fetchCached(`${API}/current/${next.round}/qualifying.json?limit=40`);
    for (const r of q.MRData.RaceTable.Races[0]?.QualifyingResults ?? [])
      upGrid.set(r.Driver.familyName, parseInt(r.position, 10) || 25);
  } catch {}
  const gridKnown = upGrid.size > 0;
  const preds = predictDrivers(drivers, {}, gridKnown ? upGrid : undefined);
  const wetRounds = await loadWetRounds(last);
  const wetSkill = wetSkillDeltas(drivers, wetRounds, last);

  // circuit record: wins/podiums/points at this track over the past seasons
  let track = new Map();
  try {
    track = await loadTrackRecord(next.Circuit.circuitId, parseInt(sched.MRData.RaceTable.season, 10));
  } catch {}

  const vals = [...preds.values()];
  const fieldMean = vals.reduce((a, p) => a + p.norm, 0) / (vals.length || 1);
  const rows = [];
  for (const [name, p] of preds) {
    let pts = p.norm;
    const tr = track.get(name);
    if (tr) {
      // more visits here = more trust in the track record, capped at TRACK_WEIGHT
      const tw = TRACK_WEIGHT * (tr.races / (tr.races + 2));
      pts = (1 - tw) * pts + tw * tr.avg;
    }
    // driver-specific wet skill first, then residual compression: rain still hides car pace
    pts += rainProb * (wetSkill.get(name) ?? 0);
    const k = (wetSkill.size ? 0.3 : 0.5) * rainProb;
    pts = (1 - k) * pts + k * fieldMean;
    rows.push({ name, pts, tr, ws: wetSkill.get(name) });
  }
  rows.sort((a, b) => b.pts - a.pts);

  title(`Forecast · fantasy pts · ${countryFlag(next.Circuit.Location.country)}${next.raceName} · ${next.date}`
    + `${gridKnown ? " · grid known" : ""}${next.Sprint ? " · sprint weekend" : ""}`);
  rows.slice(0, 10).forEach((r, i) =>
    rowHTML(i + 1, dn(r.name), r.pts.toFixed(1) + " pts", "",
      (gridKnown && upGrid.has(r.name) ? `starts P${upGrid.get(r.name)} · ` : "")
      + (r.tr ? `here: ${r.tr.wins}W/${r.tr.podiums}P in ${r.tr.races}, avg ${Math.round(r.tr.avg)} pts · `
            : "first time here · ")
      + (r.ws != null ? `wet skill ${r.ws >= 0 ? "+" : ""}${r.ws.toFixed(1)} · ` : "")
      + (w0?.rain != null ? `rain risk ${w0.rain}%` : "no forecast yet")));

  // who owns this track — current drivers only
  const owners = [...track.entries()].filter(([n]) => preds.has(n))
    .sort((a, b) => b[1].wins - a[1].wins || b[1].avg - a[1].avg).slice(0, 5);
  if (owners.length) {
    title(`Track record · ${countryFlag(next.Circuit.Location.country)}${next.Circuit.circuitName} (last ${HISTORY_YEARS} yrs)`);
    owners.forEach(([n, r], i) =>
      rowHTML(i + 1, dn(n), r.wins + (r.wins === 1 ? " win" : " wins"), r.wins ? "up" : "",
        `${r.podiums} podium${r.podiums === 1 ? "" : "s"} in ${r.races} race${r.races === 1 ? "" : "s"} · weighted avg ${r.avg.toFixed(1)} pts`));
  }

  note((wetRounds.size
      ? `Wet rounds so far: ${[...wetRounds].sort((a, b) => a - b).map(r => "R" + r).join(", ")} (OpenF1 rainfall data) — wet skill is each driver's wet-vs-dry points delta, shrunk by sample size. `
      : "No wet races detected this season (OpenF1) — rain adjustment is field compression only. ")
    + `Track record blends up to ${TRACK_WEIGHT * 100}% of a driver's last-${HISTORY_YEARS}-seasons form here, `
    + "weighted toward recent years and by how often they've raced the track. "
    + (gridKnown ? "Qualifying is in, so each driver's actual grid slot is folded into the prediction — the strongest signal available. "
                 : "Once qualifying runs, each driver's grid slot gets folded in (the strongest signal). ")
    + "Weather forecasts only reach ~16 days out.");
}

// ---------- Analysis 8: walk-forward backtest + auto-tune ----------
// predict each round k from rounds 1..k-1 only, score in fantasy points
function walkForward(allResults, allSprints, allQuali, last, opts) {
  const full = buildDriverData(allResults, allSprints, allQuali, last);
  const actualByRound = new Map();
  for (const [nm, d] of full) {
    const m = new Map();
    for (const rd of d.rounds) m.set(last - rd.age, rd.fpts);
    actualByRound.set(nm, m);
  }
  const err = { "Season average": 0, "Last-4 average": 0, "Full model": 0 };
  const perRound = [];
  let n = 0;
  for (let k = 5; k <= last; k++) {
    const drivers = activeOnly(buildDriverData(allResults, allSprints, allQuali, k - 1), allResults[k - 2]);
    // round k's actual starting grid is known before the race, so it's fair to predict with it
    const gridMap = new Map();
    for (const res of allResults[k - 1]) gridMap.set(res.Driver.familyName, parseInt(res.grid, 10) || 25);
    const model = predictDrivers(drivers, opts, gridMap);
    const roundErr = { "Season average": 0, "Last-4 average": 0, "Full model": 0 };
    let rn = 0;
    for (const res of allResults[k - 1]) {
      const nm = res.Driver.familyName;
      const act = actualByRound.get(nm)?.get(k);
      if (act == null) continue;
      const d = drivers.get(nm);
      const season = d ? d.rounds.reduce((a, rd) => a + rd.fpts, 0) / d.rounds.length : 0;
      const recent = (d?.rounds ?? []).filter(rd => rd.age < 4);
      const last4 = recent.length ? recent.reduce((a, rd) => a + rd.fpts, 0) / recent.length : 0;
      roundErr["Season average"] += Math.abs(season - act);
      roundErr["Last-4 average"] += Math.abs(last4 - act);
      roundErr["Full model"] += Math.abs((model.get(nm)?.norm ?? 0) - act);
      rn++; n++;
    }
    for (const m in err) err[m] += roundErr[m];
    const w = Object.entries(roundErr).sort((a, b) => a[1] - b[1])[0];
    perRound.push({ k, winner: w[0], mae: w[1] / (rn || 1) });
  }
  for (const m in err) err[m] /= n || 1;
  return { err, perRound, n };
}

async function backtest() {
  const last = await getLatestRound();
  if (last < 5) { note("Need at least 5 completed rounds to backtest."); return; }
  const { allResults, allSprints, allQuali } = await loadModelData(last);
  setStatus("Running walk-forward backtest…", true);
  const { err, perRound, n } = walkForward(allResults, allSprints, allQuali, last);

  title(`Walk-forward backtest · rounds 5–${last} · fantasy pts`);
  Object.entries(err).sort((a, b) => a[1] - b[1])
    .forEach(([label, mae], i) => rowHTML(i + 1, label, mae.toFixed(2) + " MAE", i === 0 ? "up" : ""));

  title("Best method per round");
  perRound.forEach(r => rowHTML("R" + r.k, r.winner, r.mae.toFixed(2) + " MAE"));
  const t = tuneParams();
  note(`${n} driver-round predictions, each made using only the rounds before it. MAE = mean absolute fantasy-point `
    + `error per driver (lower is better). Current model constants: λ=${t.decay}, shrink k=${t.shrinkK}, `
    + `quali ${t.qualiPts}/% gap, mech DNF weight ${t.mechW}.`);
  out.insertAdjacentHTML("beforeend",
    `<button class="optimize" onclick="tuneModel()">Auto-tune model constants</button><div id="tuneOut"></div>`);
}

async function tuneModel() {
  const tuneOut = document.getElementById("tuneOut");
  tuneOut.innerHTML = `<p class="note">Searching combinations…</p>`;
  const last = await getLatestRound();
  const { allResults, allSprints, allQuali } = await loadModelData(last);
  const results = [];
  for (const decay of [0.8, 0.9, 1])
    for (const shrinkK of [1, 3, 5])
      for (const qualiPts of [0, 2, 4])
        for (const mechW of [0.5, 1])
          for (const gridW of [0, 0.3, 0.5, 0.7]) {
            const { err } = walkForward(allResults, allSprints, allQuali, last, { decay, shrinkK, qualiPts, mechW, gridW });
            results.push({ decay, shrinkK, qualiPts, mechW, gridW, mae: err["Full model"] });
          }
  results.sort((a, b) => a.mae - b.mae);
  const best = results[0];
  localStorage.setItem("pw-tune", JSON.stringify({
    decay: best.decay, shrinkK: best.shrinkK, qualiPts: best.qualiPts, mechW: best.mechW, gridW: best.gridW,
  }));
  tuneOut.innerHTML = `<div class="section-title">Tuned · best of ${results.length} combos</div>`
    + results.slice(0, 5).map((r, i) =>
      `<div class="row"><span class="pos">${i + 1}</span><span class="name">λ=${r.decay} · k=${r.shrinkK} · quali ${r.qualiPts} · mech ${r.mechW} · grid ${r.gridW}</span>`
      + `<span class="val ${i === 0 ? "up" : ""}">${r.mae.toFixed(2)} MAE</span></div>`).join("")
    + `<p class="note">Best combo saved — the Form predictor, Race forecast and Team optimizer now use it. `
    + `Tuned on only ${last - 4} test rounds, so expect modest gains; re-tune after each race.</p>`;
}

// ---------- Analysis 9: team optimizer ----------
function priceKey(kind, name) { return `pw-price:${kind}:${name}`; }

async function teamOptimizer() {
  const last = await getLatestRound();
  const { allResults, allSprints, allQuali } = await loadModelData(last);
  // no last-round filter here — the optimizer must list every driver you could pick, including
  // ones who DNF'd, never finished, or missed the latest race
  const drivers = buildDriverData(allResults, allSprints, allQuali, last);
  const preds = predictDrivers(drivers);

  // every driver who has STARTED a race this season — includes DNF-only drivers and anyone who
  // missed the latest round, but not FP1-only reserves (who aren't pickable in the fantasy game)
  const dNames = [...preds.keys()];

  const driverPts = n => preds.get(n)?.norm ?? 0;
  const teamPred = new Map(); // constructor prediction = sum of its drivers'
  for (const p of preds.values()) teamPred.set(p.team, (teamPred.get(p.team) ?? 0) + p.norm);
  // full constructor entry list so a team yet to score still appears (no reserve-driver problem for teams)
  try {
    const cj = await fetchCached(`${API}/current/constructors.json?limit=50`);
    for (const c of cj.MRData.ConstructorTable.Constructors || []) if (!teamPred.has(c.name)) teamPred.set(c.name, 0);
  } catch {}

  // no public price API — prefill with estimates scaled from predicted points ($4.5M-$30M, the game's range)
  const scale = vals => {
    const min = Math.min(...vals), max = Math.max(...vals);
    return v => 4.5 + ((v - min) / ((max - min) || 1)) * 25.5;
  };
  const dEst = scale(dNames.map(driverPts));
  const tEst = scale([...teamPred.values()]);

  title("Team optimizer · driver prices ($M)");
  note("Prefilled with estimates scaled from predicted points — overwrite with the real prices from the official "
    + "F1 Fantasy game when you have them. Edits are saved on this device.");
  out.insertAdjacentHTML("beforeend",
    `<button class="optimize" onclick="toggleImport()">Import real prices (paste JSON)</button>`
    + `<div id="importBox" style="display:none">`
    + `<textarea id="importJson" placeholder='Paste prices, e.g. {"drivers":{"Verstappen":28.5},"constructors":{"McLaren":24}}'></textarea>`
    + `<button class="optimize" onclick="applyImport()">Apply prices</button><div id="importMsg"></div></div>`
    + `<div id="feedMsg"></div>`);
  const priceInput = (kind, name, pts, est, ceil = 0) => {
    const stored = localStorage.getItem(priceKey(kind, name));
    const owned = localStorage.getItem(`pw-own:${kind}:${name}`) === "1" ? " checked" : "";
    return `<div class="row"><input type="checkbox" class="own" title="I own this" data-kind="${kind}" data-name="${name}"${owned} onchange="toggleOwn(this)">`
      + `<span class="name">${kind === "d" ? dn(name) : name}`
      + `<span class="detail">predicted ${pts.toFixed(1)} pts${stored == null ? " · price estimated" : ""}</span></span>`
      + `<input class="price" data-kind="${kind}" data-name="${name}" data-pts="${pts.toFixed(2)}" data-ceil="${ceil.toFixed(1)}" type="number" `
      + `min="0" step="0.1" placeholder="$M" value="${stored ?? est.toFixed(1)}"></div>`;
  };
  dNames.sort((a, b) => driverPts(b) - driverPts(a))
    .forEach(nm => out.insertAdjacentHTML("beforeend",
      priceInput("d", nm, driverPts(nm), dEst(driverPts(nm)), preds.get(nm)?.ceil ?? 0)));
  title("Constructor prices ($M)");
  [...teamPred.keys()].sort((a, b) => teamPred.get(b) - teamPred.get(a))
    .forEach(t => out.insertAdjacentHTML("beforeend", priceInput("c", t, teamPred.get(t), tEst(teamPred.get(t)))));
  out.insertAdjacentHTML("beforeend",
    `<div class="row"><span class="name">Budget ($M)</span>`
    + `<input id="budget" type="number" min="0" step="0.5" value="${localStorage.getItem("pw-budget") ?? 100}"></div>`
    + `<button class="optimize" onclick="optimizeTeam()">Optimize · 5 drivers + 2 constructors</button><div id="optOut"></div>`);
  out.insertAdjacentHTML("beforeend",
    `<div class="section-title">Transfer planner</div>`
    + `<p class="note">Already have a team? Tick the 5 drivers + 2 constructors you own (checkboxes above), set your `
    + `free transfers, and I'll find the best swaps for the next race — netting the points hit for extra transfers.</p>`
    + `<div class="row"><span class="name">Free transfers</span>`
    + `<input id="freeTf" type="number" min="0" max="10" step="1" value="${localStorage.getItem("pw-freetf") ?? 2}"></div>`
    + `<div class="row"><span class="name">Points hit per extra transfer</span>`
    + `<input id="tfHit" type="number" min="0" step="1" value="${localStorage.getItem("pw-tfhit") ?? 10}"></div>`
    + `<button class="optimize" onclick="planTransfers()">Plan transfers</button><div id="tfOut"></div>`);
  loadPriceFeed(); // auto-fill from prices.json if a GitHub Action is publishing it (same-origin, no CORS)
}

// fetch the app's own prices.json (produced by the update-prices GitHub Action) and fill the inputs
async function loadPriceFeed() {
  let feed;
  try {
    const r = await fetch("./prices.json?t=" + Date.now());
    if (!r.ok) return; // no feed published yet — silently keep estimates/manual prices
    feed = await r.json();
  } catch { return; }
  const pairs = collectPrices(feed);
  if (!pairs.length) return;
  let n = 0;
  document.querySelectorAll("input.price").forEach(inp => {
    const app = normName(inp.dataset.name);
    const hit = pairs.find(([nm]) => { const x = normName(nm); return x === app || x.includes(app) || app.includes(x); });
    if (hit) { inp.value = hit[1]; n++; }
  });
  const when = feed.updated ? " · updated " + new Date(feed.updated).toLocaleDateString() : "";
  const el = document.getElementById("feedMsg");
  if (el) el.innerHTML = `<p class="note">✓ Loaded ${n} live prices from prices.json${when}. Edit any to override for this session.</p>`;
}

function toggleOwn(el) {
  const k = `pw-own:${el.dataset.kind}:${el.dataset.name}`;
  el.checked ? localStorage.setItem(k, "1") : localStorage.removeItem(k);
}

function planTransfers() {
  const owned = { d: [], c: [] }, avail = { d: [], c: [] };
  document.querySelectorAll("input.price").forEach(inp => {
    const price = parseFloat(inp.value);
    if (!(price > 0)) return;
    const kind = inp.dataset.kind;
    const item = { name: inp.dataset.name, price, pts: parseFloat(inp.dataset.pts), kind };
    const isOwn = localStorage.getItem(`pw-own:${kind}:${inp.dataset.name}`) === "1";
    (isOwn ? owned : avail)[kind].push(item);
  });
  const F = parseInt(document.getElementById("freeTf").value) || 0;
  const P = parseFloat(document.getElementById("tfHit").value) || 0;
  const budget = parseFloat(document.getElementById("budget").value) || 100;
  localStorage.setItem("pw-freetf", F); localStorage.setItem("pw-tfhit", P);
  const tfOut = document.getElementById("tfOut");
  if (owned.d.length !== 5 || owned.c.length !== 2) {
    tfOut.innerHTML = `<p class="err">Tick exactly 5 drivers and 2 constructors you own — currently `
      + `${owned.d.length} driver${owned.d.length === 1 ? "" : "s"} and ${owned.c.length} constructor${owned.c.length === 1 ? "" : "s"}.</p>`;
    return;
  }
  const curPrice = [...owned.d, ...owned.c].reduce((a, x) => a + x.price, 0);

  // every single swap (sell an owned player, buy an available one of the same kind)
  const moves = [];
  for (const kind of ["d", "c"]) for (const out of owned[kind]) for (const inc of avail[kind])
    moves.push({ kind, out, inc, dp: inc.pts - out.pts, dc: inc.price - out.price });

  const maxSwaps = Math.min(3, Math.max(F + 1, 2)); // let it suggest one hit beyond the free allowance
  const results = [];
  const conflict = (a, b) => a.out === b.out || a.inc === b.inc; // same slot sold twice / same buy twice
  (function search(start, chosen) {
    if (chosen.length) {
      const newPrice = curPrice + chosen.reduce((a, m) => a + m.dc, 0);
      if (newPrice <= budget) {
        const gain = chosen.reduce((a, m) => a + m.dp, 0);
        results.push({ chosen: [...chosen], net: gain - Math.max(0, chosen.length - F) * P, nSwaps: chosen.length, newPrice });
      }
    }
    if (chosen.length >= maxSwaps) return;
    for (let i = start; i < moves.length; i++) {
      if (chosen.some(c => conflict(c, moves[i]))) continue;
      chosen.push(moves[i]); search(i + 1, chosen); chosen.pop();
    }
  })(0, []);

  results.sort((a, b) => b.net - a.net);
  const top = results.filter(r => r.net > 0.05).slice(0, 5);
  tfOut.innerHTML = top.length
    ? `<div class="section-title">Best transfers · next race</div>` + top.map(r => {
        const swaps = r.chosen.map(m => `${m.kind === "d" ? dn(m.out.name) : m.out.name} → ${m.kind === "d" ? dn(m.inc.name) : m.inc.name}`).join("; ");
        const hit = Math.max(0, r.nSwaps - F) * P;
        return `<div class="row"><span class="name">${swaps}<span class="detail">${r.nSwaps} transfer${r.nSwaps > 1 ? "s" : ""}`
          + `${hit ? ` · −${hit} hit` : ""} · new spend $${r.newPrice.toFixed(1)}M</span></span>`
          + `<span class="val up">+${r.net.toFixed(1)} pts</span></div>`;
      }).join("")
      + `<p class="note">Net gain = extra predicted points minus any transfer hit. Plain predicted points (captain/DRS-boost is a separate lever above).</p>`
    : `<p class="note">No swap beats the points hit — your squad's in good shape, so bank the transfer.</p>`;
}

function toggleImport() {
  const b = document.getElementById("importBox");
  b.style.display = b.style.display === "none" ? "block" : "none";
}

const normName = s => String(s).toLowerCase().replace(/[^a-z]/g, "");

// pull (name, price) pairs out of whatever shape the paste is in
function collectPrices(data) {
  const pairs = [];
  const addObj = o => { for (const [k, v] of Object.entries(o)) { const n = parseFloat(v); if (isFinite(n)) pairs.push([k, n]); } };
  if (Array.isArray(data)) {
    for (const it of data) {
      const name = it.name ?? it.driver ?? it.constructor ?? it.team ?? it.player;
      const price = parseFloat(it.price ?? it.cost ?? it.value);
      if (name && isFinite(price)) pairs.push([name, price]);
    }
  } else if (data && typeof data === "object") {
    if (data.drivers || data.constructors) { if (data.drivers) addObj(data.drivers); if (data.constructors) addObj(data.constructors); }
    else addObj(data);
  }
  return pairs;
}

function applyImport() {
  const msg = document.getElementById("importMsg");
  let data;
  try { data = JSON.parse(document.getElementById("importJson").value); }
  catch { msg.innerHTML = `<p class="err">That isn't valid JSON — check for a stray comma or quote.</p>`; return; }
  const pairs = collectPrices(data);
  if (!pairs.length) { msg.innerHTML = `<p class="err">No name/price pairs found in that JSON.</p>`; return; }

  const inputs = [...document.querySelectorAll("input.price")];
  const usedPairs = new Set();
  let matched = 0;
  for (const inp of inputs) {
    const app = normName(inp.dataset.name);
    const hit = pairs.find(([n]) => { const x = normName(n); return x === app || x.includes(app) || app.includes(x); });
    if (hit) {
      inp.value = hit[1];
      localStorage.setItem(priceKey(inp.dataset.kind, inp.dataset.name), hit[1]);
      const tag = inp.closest(".row").querySelector(".detail");
      if (tag) tag.textContent = tag.textContent.replace(" · price estimated", "");
      usedPairs.add(hit[0]); matched++;
    }
  }
  const leftovers = pairs.filter(([n]) => !usedPairs.has(n)).map(([n]) => n);
  msg.innerHTML = `<p class="note">Filled ${matched} of ${inputs.length} prices from ${pairs.length} entries.`
    + (leftovers.length ? ` Didn't match: ${leftovers.slice(0, 8).join(", ")}${leftovers.length > 8 ? "…" : ""}.` : "")
    + ` Review the numbers, then hit Optimize.</p>`;
}

function combos(items, k, start, chosen, cb) {
  if (chosen.length === k) { cb(chosen); return; }
  for (let i = start; i <= items.length - (k - chosen.length); i++) {
    chosen.push(items[i]);
    combos(items, k, i + 1, chosen, cb);
    chosen.pop();
  }
}

function optimizeTeam() {
  const ds = [], cs = [];
  document.querySelectorAll("input.price").forEach(inp => {
    if (inp.value !== "") localStorage.setItem(priceKey(inp.dataset.kind, inp.dataset.name), inp.value);
    else localStorage.removeItem(priceKey(inp.dataset.kind, inp.dataset.name));
    const price = parseFloat(inp.value);
    if (!(price > 0)) return;
    (inp.dataset.kind === "d" ? ds : cs).push({
      name: inp.dataset.name, price,
      pts: parseFloat(inp.dataset.pts), ceil: parseFloat(inp.dataset.ceil) || 0,
    });
  });
  const budget = parseFloat(document.getElementById("budget").value) || 100;
  localStorage.setItem("pw-budget", budget);
  const optOut = document.getElementById("optOut");
  if (ds.length < 5 || cs.length < 2) {
    optOut.innerHTML = `<p class="err">Need prices for at least 5 drivers and 2 constructors.</p>`;
    return;
  }

  let best = null;
  combos(ds, 5, 0, [], five => {
    const dPrice = five.reduce((a, x) => a + x.price, 0);
    if (dPrice > budget) return;
    const dPts = five.reduce((a, x) => a + x.pts, 0);
    const cap = five.reduce((a, x) => (x.pts > a.pts ? x : a), five[0]); // DRS boost doubles the best pick
    for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {
      const price = dPrice + cs[i].price + cs[j].price;
      if (price > budget) continue;
      const pts = dPts + cap.pts + cs[i].pts + cs[j].pts;
      if (!best || pts > best.pts) best = { five: [...five], cap, pair: [cs[i], cs[j]], price, pts };
    }
  });
  if (!best) { optOut.innerHTML = `<p class="err">No combination fits the $${budget}M budget.</p>`; return; }
  optOut.innerHTML =
    `<div class="section-title">Best team · ${best.pts.toFixed(1)} pred pts · $${best.price.toFixed(1)}M</div>`
    + best.five.map(x => `<div class="row"><span class="name">${dn(x.name)}`
      + `${x === best.cap ? `<span class="detail">DRS boost — counts double</span>` : ""}</span>`
      + `<span class="val${x === best.cap ? " up" : ""}">$${x.price.toFixed(1)}M · `
      + `${(x === best.cap ? 2 * x.pts : x.pts).toFixed(1)} pts</span></div>`).join("")
    + best.pair.map(x => `<div class="row"><span class="name">${x.name}<span class="detail">constructor</span></span>`
      + `<span class="val">$${x.price.toFixed(1)}M · ${x.pts.toFixed(1)} pts</span></div>`).join("");
  // expectation says boost the highest mean — but if you're chasing a lead, boost the highest ceiling
  const hc = best.five.reduce((a, x) => (x.ceil > a.ceil ? x : a), best.five[0]);
  if (hc.name !== best.cap.name)
    optOut.insertAdjacentHTML("beforeend",
      `<p class="note">Chasing your league? ${dn(hc.name)} is the higher-ceiling boost: his best rounds average `
      + `${hc.ceil.toFixed(1)} pts vs ${best.cap.name}'s ${best.cap.ceil.toFixed(1)} — riskier, bigger jackpot.</p>`);

  // value = predicted points per $M — the bargains, flagged whether or not they made the best team
  const picked = new Set([...best.five, ...best.pair].map(x => x.name));
  const valueList = (items, kind, n) => items
    .filter(x => x.pts > 0)
    .map(x => ({ ...x, value: x.pts / x.price }))
    .sort((a, b) => b.value - a.value)
    .slice(0, n)
    .map((x, i) => `<div class="row"><span class="pos">${i + 1}</span>`
      + `<span class="name">${kind === "d" ? dn(x.name) : x.name}`
      + `${picked.has(x.name) ? `<span class="detail">in your best team</span>` : ""}</span>`
      + `<span class="val up">${x.value.toFixed(2)} pts/$M</span></div>`).join("");
  optOut.insertAdjacentHTML("beforeend",
    `<div class="section-title">Best value drivers · pts per $M</div>${valueList(ds, "d", 5)}`
    + `<div class="section-title">Best value constructors · pts per $M</div>${valueList(cs, "c", 3)}`
    + `<p class="note">Value = predicted points ÷ price. Spot the bargains the optimizer leans on — `
    + `and the cheap upside it skipped for budget reasons.</p>`);
}

// offline shell: no-op when sw.js isn't present (e.g. opening the file directly)
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------- Analysis: live timing (OpenF1) ----------
const OF1 = "https://api.openf1.org/v1";
const GE = "date%3E=", LE = "date%3C=";
const TYRE_LETTER = { SOFT: "S", MEDIUM: "M", HARD: "H", INTERMEDIATE: "I", WET: "W" };

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function ofJson(path, tries = 4) {
  // optional user OpenF1 token (stored on-device only) raises the rate limit for a full race
  const tok = localStorage.getItem("pw-of1-token");
  const opts = tok ? { headers: { Authorization: "Bearer " + tok } } : undefined;
  for (let a = 0; ; a++) {
    let res;
    try {
      res = await fetch(OF1 + path, opts);
    } catch (e) { // connection-level failure (blip, throttle, CORS-less block) — retry, don't crash the refresh
      if (a < tries) { await sleep(700 * (a + 1)); continue; }
      throw new Error("OpenF1 unreachable");
    }
    if (res.status === 429 && a < tries) { await sleep(700 * (a + 1)); continue; } // rate limit
    if (res.status === 404) return []; // OpenF1 says 404 for a query that matched no rows
    if (!res.ok) throw new Error("OpenF1 " + res.status);
    return res.json();
  }
}

// run thunks with limited concurrency so we don't burst past the rate limit
async function pool(thunks, n = 2) {
  const out = new Array(thunks.length);
  let i = 0;
  async function worker() { while (i < thunks.length) { const k = i++; out[k] = await thunks[k](); } }
  await Promise.all(Array.from({ length: Math.min(n, thunks.length) }, worker));
  return out;
}
function latestByDriver(arr, newer) {
  const m = new Map();
  for (const x of arr) { const c = m.get(x.driver_number); if (!c || newer(x, c)) m.set(x.driver_number, x); }
  return m;
}
function fmtGap(v) { return v == null ? "—" : (typeof v === "string" ? v : "+" + v.toFixed(3)); }
function fmtLap(sec) { return Math.floor(sec / 60) + ":" + (sec % 60).toFixed(3).padStart(6, "0"); }

let ltPath = null, ltTf = null, ltKey = null; // track outline + transform, cached per session
const ltOpen = new Set(); // driver numbers whose telemetry panel is expanded (survives refreshes)

async function buildOutline(s, num) {
  const start = Date.parse(s.date_start), endRef = Math.min(Date.now(), Date.parse(s.date_end));
  const mid = start + (endRef - start) * 0.5; // mid-session = clean green-flag running
  const from = new Date(mid).toISOString(), to = new Date(mid + 130000).toISOString();
  const loc = await ofJson(`/location?session_key=${s.session_key}&driver_number=${num}&${GE}${from}&${LE}${to}`);
  const pts = loc.filter(p => p.x || p.y).map(p => [p.x, p.y]);
  if (pts.length < 20) { ltPath = ltTf = null; return; }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = maxX - minX || 1, h = maxY - minY || 1, scale = 920 / Math.max(w, h);
  const ox = (1000 - w * scale) / 2, oy = (1000 - h * scale) / 2;
  ltPath = pts;
  ltTf = ([x, y]) => [ox + (x - minX) * scale, oy + (maxY - y) * scale]; // flip Y for SVG
}

function paintTrack(carLatest, dinfo) {
  const svg = document.getElementById("lt-track");
  if (!ltPath || !ltTf) { svg.innerHTML = `<text x="500" y="500" fill="#8b919d" font-size="34" text-anchor="middle">track map unavailable</text>`; return; }
  const d = "M" + ltPath.map(p => ltTf(p).map(n => n.toFixed(1)).join(",")).join(" L") + "Z";
  let dots = "";
  for (const [num, p] of carLatest) {
    const info = dinfo.get(num);
    if (!info) continue; // skip stray numbers (safety car etc.) not in the driver list
    const [cx, cy] = ltTf([p.x, p.y]);
    const col = info.team_colour ? "#" + info.team_colour : "#888";
    dots += `<circle class="car" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="17" fill="${col}"/>`
      + `<text class="carnum" x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" font-size="20">${num}</text>`;
  }
  svg.innerHTML = `<path class="outline" d="${d}"/>${dots}`;
}

function renderTower(position, intervals, laps, stints, dinfo, tele, isLive) {
  const pos = latestByDriver(position, (a, b) => a.date > b.date);
  const intv = latestByDriver(intervals, (a, b) => a.date > b.date);
  const lap = latestByDriver(laps, (a, b) => a.lap_number > b.lap_number);
  const stint = latestByDriver(stints, (a, b) => a.lap_start > b.lap_start);

  // starting position (earliest record per driver) for the gained/lost arrows
  const startPos = new Map();
  for (const p of position) { const c = startPos.get(p.driver_number); if (!c || p.date < c.date) startPos.set(p.driver_number, p); }

  // fastest lap, per-driver best lap, and session/personal best sectors (purple/green)
  let fastest = null;
  const bestLap = new Map(), bestSec = [new Map(), new Map(), new Map()], sessSec = [Infinity, Infinity, Infinity];
  for (const l of laps) {
    const d = l.driver_number;
    if (l.lap_duration > 0) {
      if (!fastest || l.lap_duration < fastest.lap_duration) fastest = l;
      const b = bestLap.get(d); if (!b || l.lap_duration < b.lap_duration) bestLap.set(d, l); // fastest lap OBJECT
    }
    [l.duration_sector_1, l.duration_sector_2, l.duration_sector_3].forEach((s, i) => {
      if (s > 0) { if (!bestSec[i].has(d) || s < bestSec[i].get(d)) bestSec[i].set(d, s); if (s < sessSec[i]) sessSec[i] = s; }
    });
  }
  const fastestNum = fastest?.driver_number;

  // tyre-stint history per driver
  const stintHist = new Map();
  for (const s of [...stints].sort((a, b) => a.lap_start - b.lap_start)) {
    if (!stintHist.has(s.driver_number)) stintHist.set(s.driver_number, []);
    stintHist.get(s.driver_number).push(s);
  }

  const order = [...pos.values()].sort((a, b) => a.position - b.position);
  let html = "";
  for (const p of order) {
    const num = p.driver_number, info = dinfo.get(num) || {};
    const col = info.team_colour ? "#" + info.team_colour : "#666";
    const gap = p.position === 1 ? "LEADER" : fmtGap(intv.get(num)?.gap_to_leader);
    const tl = TYRE_LETTER[stint.get(num)?.compound] || "";
    // live: the driver's latest lap (purple if session-best, green if a personal best).
    // finished replay: the driver's fastest lap (session-fastest shown purple) — cooldown laps aren't useful.
    const shownLap = isLive ? lap.get(num) : bestLap.get(num), ll = shownLap?.lap_duration;
    const tm = tele && tele.get(num), spd = tm?.speed;
    const drsOpen = tm && tm.drs != null && tm.drs >= 10; // OpenF1: 10/12/14 = DRS active
    const sp = startPos.get(num)?.position, delta = sp != null ? sp - p.position : 0;
    const arrow = delta > 0 ? `<span class="chg up">▲${delta}</span>`
      : delta < 0 ? `<span class="chg dn">▼${-delta}</span>` : "";
    let lapCls = "";
    if (ll != null) {
      if (num === fastestNum && ll === fastest.lap_duration) lapCls = "pb-sess";
      else if (isLive && ll === bestLap.get(num)?.lap_duration) lapCls = "pb-self";
    }
    const shot = info.headshot_url
      ? `<img class="shot" src="${info.headshot_url}" alt="" loading="lazy">`
      : `<span class="shot ph" style="background:${col}"></span>`;
    const fl = num === fastestNum ? `<span class="fl" title="Fastest lap">FL</span>` : "";
    html += `<details class="tt-row" data-num="${num}"${ltOpen.has(num) ? " open" : ""}><summary>`
      + `<span class="p">${p.position}${arrow}</span>`
      + `<span class="bar" style="background:${col}"></span>`
      + shot
      + `<span class="who"><span class="acr">${info.name_acronym || num}${fl}</span></span>`
      + `<span class="data">${tl ? `<span class="tyre ${tl}">${tl}</span>` : ""}`
      + `${drsOpen ? `<span class="drs">DRS</span>` : ""}`
      + `<span class="spd">${spd != null ? spd + `<i>km/h</i>` : ""}</span>`
      + `<span class="lap ${lapCls}">${ll ? fmtLap(ll) : "—"}</span>`
      + `<span class="gap">${gap}</span></span></summary>`
      + teleHTML(tm, shownLap, bestSec, sessSec, num, stintHist.get(num), info.team_name)
      + `</details>`;
  }
  const tower = document.getElementById("lt-tower");
  tower.innerHTML = html;
  // keep expanded rows expanded across the 5s refreshes
  tower.querySelectorAll("details.tt-row").forEach(d =>
    d.addEventListener("toggle", () => { d.open ? ltOpen.add(+d.dataset.num) : ltOpen.delete(+d.dataset.num); }));
}

function teleHTML(tm, lapObj, bestSec, sessSec, num, stints, team) {
  let secs = "";
  if (lapObj) {
    const cells = [lapObj.duration_sector_1, lapObj.duration_sector_2, lapObj.duration_sector_3].map((s, i) => {
      if (!(s > 0)) return `<span class="sec">S${i + 1} —</span>`;
      const cls = s <= (sessSec?.[i] ?? Infinity) + 1e-6 ? "pb-sess"
        : s <= (bestSec?.[i]?.get(num) ?? Infinity) + 1e-6 ? "pb-self" : "";
      return `<span class="sec ${cls}">S${i + 1} ${s.toFixed(1)}</span>`;
    });
    secs = `<div class="secs">${cells.join("")}</div>`;
  }
  let st = "";
  if (stints && stints.length)
    st = `<div class="stints">${stints.map(s => `<span class="st ${TYRE_LETTER[s.compound] || ""}">`
      + `${TYRE_LETTER[s.compound] || "?"} ${s.lap_start}–${s.lap_end}</span>`).join("")}</div>`;
  let tel = "";
  if (tm && tm.speed != null) {
    const thr = Math.max(0, Math.min(100, tm.throttle ?? 0)), brk = Math.max(0, Math.min(100, tm.brake ?? 0));
    tel = `<div class="ch"><span class="lbl">Throttle</span><span class="bar2"><span class="fill thr" style="width:${thr}%"></span></span><span class="v">${thr}%</span></div>`
      + `<div class="ch"><span class="lbl">Brake</span><span class="bar2"><span class="fill brk" style="width:${brk}%"></span></span><span class="v">${brk}%</span></div>`
      + `<div class="nums"><span>Gear<b>${tm.n_gear ?? "—"}</b></span><span>RPM<b>${tm.rpm != null ? tm.rpm.toLocaleString() : "—"}</b></span>`
      + `<span>Speed<b>${tm.speed} km/h</b></span></div>`;
  }
  const head = team ? `<div class="team-hd">${team}</div>` : "";
  if (!secs && !st && !tel) return `<div class="tele">${head}<span class="na">No live data for this driver.</span></div>`;
  return `<div class="tele">${head}${secs}${st}${tel}</div>`;
}

function renderRaceControl(rc) {
  const el = document.getElementById("lt-rc");
  if (!el) return;
  const keep = (rc || []).filter(r => ["Flag", "SafetyCar", "SessionStatus"].includes(r.category)
    || /PENALTY|INVESTIGAT|DELETED|NOTED/i.test(r.message || ""));
  const recent = keep.slice(-6).reverse();
  const cls = r => r.category === "SafetyCar" ? "sc"
    : r.flag === "CHEQUERED" ? "chq"
    : /YELLOW/.test(r.flag || "") ? "yellow"
    : r.flag === "RED" ? "red"
    : /GREEN|CLEAR/.test(r.flag || "") ? "green" : "";
  el.innerHTML = `<div class="rc-title">Race control</div>`
    + (recent.length
      ? recent.map(r => `<div class="rc-msg ${cls(r)}"><span class="rc-lap">L${r.lap_number ?? "–"}</span>`
        + `<span>${r.message || r.flag || r.category}</span></div>`).join("")
      : `<div class="rc-msg"><span>No race control messages yet.</span></div>`);
}

// fetch location + car_data around a moment. When live, widen the window until we actually catch
// the field — a real F1 feed is timestamped seconds-to-a-minute behind wall-clock, so a fixed
// "last 8 seconds" window would come up empty. latestByDriver then picks each car's freshest sample.
async function snapPair(k, at, isLive) {
  const widths = isLive ? [30000, 90000, 180000] : [6000];
  let locMap = new Map(), teleMap = new Map();
  for (const w of widths) {
    const from = new Date(at - w).toISOString(), to = new Date(at + 5000).toISOString();
    const [loc, cars] = await pool([
      () => ofJson(`/location?session_key=${k}&${GE}${from}&${LE}${to}`),
      () => ofJson(`/car_data?session_key=${k}&${GE}${from}&${LE}${to}`),
    ], 2);
    locMap = latestByDriver(loc.filter(p => p.x || p.y), (a, b) => a.date > b.date);
    teleMap = latestByDriver(cars, (a, b) => a.date > b.date);
    if (locMap.size >= 15) break; // caught the field — stop widening
  }
  return { locMap, teleMap };
}

function saveOf1Token() {
  const el = document.getElementById("of1tok") || document.getElementById("of1tok2");
  const v = el.value.trim();
  if (v) localStorage.setItem("pw-of1-token", v); else localStorage.removeItem("pw-of1-token");
  el.blur();
  setStatus(v ? "OpenF1 token saved on this device — live timing will use it." : "OpenF1 token cleared.", false);
}

async function liveTiming() {
  out.innerHTML = `<div class="lt-head"><span class="lt-title">Live timing</span></div><p class="note">Connecting to OpenF1…</p>`;
  let sessions, drivers;
  try {
    [sessions, drivers] = await Promise.all([
      ofJson("/sessions?session_key=latest"), ofJson("/drivers?session_key=latest"),
    ]);
  } catch (e) {
    // OpenF1-specific failure — keep it out of the generic "check your connection" handler
    out.innerHTML = `<div class="lt-head"><span class="lt-title">Live timing</span></div>`
      + `<p class="err">OpenF1 — the live-timing data source — is unreachable right now. This is almost `
      + `always a temporary rate limit that clears within a few minutes, and it doesn't affect anything `
      + `else in the app.</p>`
      + `<button class="optimize" onclick="run(liveTiming, document.querySelectorAll('nav button')[0])">Retry</button>`;
    return;
  }
  const s = sessions[0];
  if (!s) { note("No session data available from OpenF1 right now."); return; }
  const dinfo = new Map(drivers.map(d => [d.driver_number, d]));
  const now = Date.now(), isLive = now >= Date.parse(s.date_start) && now <= Date.parse(s.date_end) + 5 * 60e3;

  out.innerHTML =
    `<div class="lt-head"><span class="lt-title">${countryFlag(s.country_name)}${s.circuit_short_name} · ${s.session_name}</span>`
    + `<span class="lt-badge ${isLive ? "live" : "past"}">${isLive ? "● LIVE" : "Latest session"}</span>`
    + `<span class="lt-sub" id="lt-sub">Loading…</span></div>`
    + `<svg class="track" id="lt-track" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>`
    + `<div id="lt-rc"></div>`
    + `<div id="lt-tower"></div>`;

  if (ltKey !== s.session_key) { // the map is a bonus — never let it block the timing tower
    try { await buildOutline(s, drivers[0]?.driver_number ?? 1); ltKey = s.session_key; } catch { ltPath = ltTf = null; }
  }

  const k = s.session_key;
  async function refresh() {
    try {
      // wave 1: order, tyres, laps. Live windows are wide so feed lag can't empty them.
      const lapWin = new Date(Date.now() - 400000).toISOString();
      const [position, stints, laps, rc] = await pool([
        () => ofJson(`/position?session_key=${k}`),
        () => ofJson(`/stints?session_key=${k}`),
        () => ofJson(`/laps?session_key=${k}` + (isLive ? `&date_start%3E=${lapWin}` : "")),
        () => ofJson(`/race_control?session_key=${k}`),
      ], 2);
      renderRaceControl(rc);

      // the tower is anchored to the end of running — a finished session's date_end is padded,
      // so find when cars actually last ran from the lap timestamps
      let towerAnchor = Date.now();
      const start = Date.parse(s.date_start);
      if (!isLive) { towerAnchor = 0; for (const l of laps) { const t = Date.parse(l.date_start) + (l.lap_duration || 0) * 1000; if (t > towerAnchor) towerAnchor = t; } }
      // gaps: wide window tolerates feed lag; latestByDriver picks each car's freshest reading
      const gapFrom = new Date(towerAnchor - (isLive ? 120000 : 130000)).toISOString();
      const intervals = await ofJson(`/intervals?session_key=${k}&${GE}${gapFrom}`);

      // map + telemetry: live = now (snapPair widens to catch a laggy feed); finished = a mid-race
      // green-flag moment so cars are spread and moving
      const snapAt = isLive ? Date.now() : start + 0.55 * (towerAnchor - start);
      const { locMap, teleMap } = await snapPair(k, snapAt, isLive);

      renderTower(position, intervals, laps, stints, dinfo, teleMap, isLive);
      paintTrack(locMap, dinfo);

      // surface how far behind the live feed is, so lag is visible rather than mysterious
      let lagTxt = "";
      if (isLive) {
        let newest = 0;
        for (const p of locMap.values()) { const t = Date.parse(p.date); if (t > newest) newest = t; }
        lagTxt = newest ? ` · feed ${Math.max(0, Math.round((Date.now() - newest) / 1000))}s behind` : " · waiting for feed";
      }
      document.getElementById("lt-sub").textContent =
        (isLive ? "Updating live · " : "Final classification · ") + new Date(s.date_start).toDateString()
        + " · refreshed " + new Date().toLocaleTimeString() + lagTxt;
    } catch (e) {
      const sub = document.getElementById("lt-sub");
      if (sub) sub.textContent = "Update failed: " + e.message;
    }
  }

  await refresh();
  out.insertAdjacentHTML("beforeend", isLive
    ? `<p class="note">Live from OpenF1, refreshing every 8s — track positions, order, gaps, tyres, speed, `
      + `race control, places gained/lost (▲▼) and the fastest lap (FL, purple). Purple lap = session best, `
      + `green = personal best. Tap any driver for sectors, tyre stints and live throttle/brake/gear/RPM.</p>`
    : `<p class="note">No race is live now — this replays the last session. Tower shows final classification with `
      + `places gained/lost (▲▼) and the fastest lap (FL); purple lap = session best, green = personal best. `
      + `Track map, speeds and telemetry are sampled from a mid-race moment. Tap any driver for sectors, tyre `
      + `stints and throttle/brake/gear/RPM. Everything updates live during a real session.</p>`);
  out.insertAdjacentHTML("beforeend",
    `<div class="lt-token"><input id="of1tok" type="password" placeholder="OpenF1 API token (optional)" `
    + `value="${localStorage.getItem("pw-of1-token") ?? ""}"><button class="optimize" onclick="saveOf1Token()">Save token</button>`
    + `<div class="note">A free OpenF1 account gives a much higher rate limit — paste your token to keep live timing `
    + `reliable through a full 2-hour race (5s polling can otherwise hit the anonymous limit). Stored only on this device, never sent anywhere but OpenF1.</div></div>`);
  setStatus(isLive ? "Live timing — auto-refreshing every 8s." : "Showing the latest completed session (no race live now).", false);
  if (isLive) liveTimer = setInterval(refresh, 8000);
}

// ---------- settings ----------
const TUNE_META = [
  ["gridW", "Grid weight", "0–1 · how much the starting grid drives the forecast (the strongest signal)"],
  ["decay", "Recency weight (λ)", "0–1 · lower leans harder on recent rounds; 1 = plain season average"],
  ["shrinkK", "Shrinkage (k)", "higher trusts the field average more for drivers with few rounds"],
  ["qualiPts", "Quali weight", "points per 1% of qualifying gap-to-pole improvement"],
  ["mechW", "Mechanical-DNF weight", "0–1 · how much a mechanical DNF predicts future ones"],
];

function settings() {
  stopLive();
  out.innerHTML = "";
  const t = tuneParams();
  title("Settings · prediction model");
  note("These constants drive the forecast, form predictor and optimizer. The Backtest's auto-tune sets them for "
    + "you from the data — override here only if you want to experiment.");
  TUNE_META.forEach(([key, label, desc]) => out.insertAdjacentHTML("beforeend",
    `<div class="row"><span class="name">${label}<span class="detail">${desc}</span></span>`
    + `<input class="tune-in" data-key="${key}" type="number" step="0.05" value="${t[key]}"></div>`));
  out.insertAdjacentHTML("beforeend",
    `<button class="optimize" onclick="saveTune()">Save model settings</button>`
    + `<button class="optimize secondary" onclick="resetTune()">Reset to defaults</button><div id="setMsg"></div>`);

  title("Settings · live timing");
  out.insertAdjacentHTML("beforeend",
    `<div class="lt-token"><input id="of1tok2" type="password" placeholder="OpenF1 API token (optional)" `
    + `value="${localStorage.getItem("pw-of1-token") ?? ""}"><button class="optimize" onclick="saveOf1Token()">Save token</button>`
    + `<div class="note">A free OpenF1 account raises the rate limit — keeps live timing reliable through a full race. Stored on this device only.</div></div>`);

  title("Settings · data & storage");
  out.insertAdjacentHTML("beforeend",
    `<button class="optimize" onclick="clearCache()">Clear cached race data</button>`
    + `<button class="optimize secondary" onclick="clearTeam()">Clear saved fantasy team</button>`
    + `<div id="dataMsg" class="note">Cached race data makes daily opens near-instant; clearing forces a fresh fetch. `
    + `Your prices, saved team and settings are stored separately and aren't touched by clearing the cache.</div>`);
  setStatus("Settings — every change saves on this device only.", false);
}

function saveTune() {
  const t = { ...tuneParams() };
  document.querySelectorAll(".tune-in").forEach(i => { const v = parseFloat(i.value); if (isFinite(v)) t[i.dataset.key] = v; });
  localStorage.setItem("pw-tune", JSON.stringify(t));
  document.getElementById("setMsg").innerHTML = `<p class="note">Saved — the forecast, form predictor and optimizer now use these.</p>`;
}
function resetTune() { localStorage.removeItem("pw-tune"); settings(); }
function clearCache() {
  Object.keys(localStorage).filter(k => k.startsWith(CACHE_VER)).forEach(k => localStorage.removeItem(k));
  cache.clear(); latestRound = null;
  document.getElementById("dataMsg").innerHTML = "Cached race data cleared — the next analysis refetches fresh.";
}
function clearTeam() {
  Object.keys(localStorage).filter(k => k.startsWith("pw-own:")).forEach(k => localStorage.removeItem(k));
  document.getElementById("dataMsg").innerHTML = "Saved fantasy team cleared.";
}

// ---------- landing dashboard ----------
function openAnalysis(fn, label) {
  const b = [...document.querySelectorAll("nav button")].find(x => x.textContent.toLowerCase().includes(label));
  run(fn, b);
}
function goDashboard() {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  stopLive();
  dashboard();
}
function fmtCountdown(ms) {
  if (ms <= 0) return "now";
  const h = ms / 3600e3;
  if (h < 1) return Math.max(1, Math.round(ms / 60e3)) + " min";
  if (h < 24) return Math.round(h) + " hr";
  return Math.round(h / 24) + " days";
}
const raceStart = r => Date.parse(r.date + "T" + (r.time || "12:00:00Z"));

let dashRun = 0;
async function dashboard() {
  const myRun = ++dashRun; // a newer dashboard() supersedes this one's async writes
  out.innerHTML = "";
  setStatus("Loading dashboard…", true);
  let sched, dStand, cStand;
  try {
    [sched, dStand, cStand] = await Promise.all([
      fetchCached(`${API}/current.json?limit=30`),
      fetchCached(`${API}/current/driverStandings.json`),
      fetchCached(`${API}/current/constructorStandings.json`).catch(() => null),
    ]);
  } catch (e) {
    setStatus("", false);
    out.innerHTML = `<p class="err">Couldn't load the dashboard (${e.message}). Pick an analysis above, or retry.</p>`
      + `<button class="optimize" onclick="goDashboard()">Retry</button>`;
    return;
  }
  if (myRun !== dashRun) return;
  const races = sched.MRData.RaceTable.Races;
  const dList = dStand.MRData.StandingsTable.StandingsLists[0]?.DriverStandings ?? [];
  latestRound = latestRound || parseInt(dStand.MRData.StandingsTable.round, 10);
  const now = Date.now();

  // next race + weekend phase
  const next = races.find(r => raceStart(r) + 2.5 * 3600e3 > now) || races[races.length - 1];
  const nStart = raceStart(next);
  const nQuali = next.Qualifying ? Date.parse(next.Qualifying.date + "T" + (next.Qualifying.time || "12:00:00Z")) : null;
  const flag = countryFlag(next.Circuit.Location.country);
  let phase, nudge;
  if (now >= nStart && now < nStart + 2.5 * 3600e3) {
    phase = "🔴 Race live now"; nudge = { label: "Open live timing", fn: "liveTiming", key: "live" };
  } else if (nQuali && now >= nQuali && now < nStart) {
    phase = "Grid is set — qualifying done"; nudge = { label: "See your grid-aware forecast", fn: "raceForecast", key: "forecast" };
  } else if (nStart - now < 3 * 24 * 3600e3) {
    phase = "Race weekend"; nudge = { label: "Check the forecast", fn: "raceForecast", key: "forecast" };
  } else {
    phase = "Next up"; nudge = { label: "Plan your team", fn: "teamOptimizer", key: "optimizer" };
  }
  out.insertAdjacentHTML("beforeend",
    `<div class="dash-hero"><div class="dh-phase">${phase}</div>`
    + `<div class="dh-race">${flag}${next.raceName}</div>`
    + `<div class="dh-when">${next.Circuit.circuitName} · lights out in <b>${fmtCountdown(nStart - now)}</b></div>`
    + `<button class="optimize" onclick="openAnalysis(${nudge.fn}, '${nudge.key}')">${nudge.label}</button></div>`);

  // championship snapshot
  title("Championship · top 3");
  dList.slice(0, 3).forEach(s => rowHTML(s.position, dn(s.Driver.familyName), s.points + " pts", "", s.Constructor?.name || ""));
  const cList = cStand?.MRData.StandingsTable.StandingsLists[0]?.ConstructorStandings ?? [];
  cList.slice(0, 3).forEach(s => rowHTML(s.position, s.Constructor.name, s.points + " pts"));

  // last race podium
  try {
    const res = (await fetchCached(`${API}/current/${latestRound}/results.json?limit=5`)).MRData.RaceTable.Races[0];
    if (res) {
      title(`Round ${latestRound} · ${countryFlag(res.Circuit.Location.country)}${res.raceName}`);
      res.Results.slice(0, 3).forEach(r => rowHTML(r.position, dn(r.Driver.familyName), r.points + " pts", "", r.Constructor.name));
    }
  } catch {}

  // my team snapshot (only if a squad is saved) — computed after the light stuff
  const ownD = [], ownC = [];
  for (const k of Object.keys(localStorage)) {
    if (k.startsWith("pw-own:d:") && localStorage.getItem(k) === "1") ownD.push(k.slice(9));
    if (k.startsWith("pw-own:c:") && localStorage.getItem(k) === "1") ownC.push(k.slice(9));
  }
  if (ownD.length === 5 && ownC.length === 2) {
    out.insertAdjacentHTML("beforeend", `<div class="section-title">My team · predicted next race</div><div id="dash-team" class="note">Computing…</div>`);
    try {
      const { allResults, allSprints, allQuali } = await loadModelData(latestRound);
      if (myRun !== dashRun) return; // a newer dashboard took over while we computed
      const drivers = activeOnly(buildDriverData(allResults, allSprints, allQuali, latestRound), allResults[latestRound - 1]);
      const preds = predictDrivers(drivers);
      const teamPred = new Map();
      for (const p of preds.values()) teamPred.set(p.team, (teamPred.get(p.team) ?? 0) + p.norm);
      const dPts = ownD.map(n => ({ n, v: preds.get(n)?.norm ?? 0 }));
      const cap = dPts.reduce((a, x) => x.v > a.v ? x : a, dPts[0]);
      const total = dPts.reduce((a, x) => a + x.v, 0) + cap.v + ownC.reduce((a, n) => a + (teamPred.get(n) ?? 0), 0);
      document.getElementById("dash-team").outerHTML =
        `<div class="section-title">My team · ~${Math.round(total)} pts next race</div>`
        + dPts.sort((a, b) => b.v - a.v).map(x => rowStr(dn(x.n) + (x === cap ? ` <span class="fl">DRS</span>` : ""), x.v.toFixed(1) + " pts")).join("")
        + ownC.map(n => rowStr(n + `<span class="detail">constructor</span>`, (teamPred.get(n) ?? 0).toFixed(1) + " pts")).join("")
        + `<p class="note">DRS-boost captain doubled in the total. Full swaps in Team optimizer → Transfer planner.</p>`;
    } catch (e) {
      const el = document.getElementById("dash-team"); if (el) el.textContent = "Couldn't compute team points right now.";
    }
  }

  out.insertAdjacentHTML("beforeend",
    `<p class="note">Data through Round ${latestRound} · updated ${new Date().toLocaleTimeString()}. Tap “Pit Wall” up top to return here.</p>`);
  setStatus("", false);
}

function rowStr(name, val, valClass = "") {
  return `<div class="row"><span class="name">${name}</span><span class="val ${valClass}">${val}</span></div>`;
}

goDashboard();
</script>
</body>
</html>
