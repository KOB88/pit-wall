<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pit Wall — F1 Fantasy Analyzer</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,500..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --panel: #f4f4f7;       /* light F1 */
    --panel-2: #e9e9ef;
    --line: #d8d8e0;
    --text: #15151e;        /* F1 near-black */
    --dim: #6b6b76;
    --accent: #e10600;      /* official F1 red */
    --up: #009a4e;          /* readable green on white */
    --down: #d40000;
    --purple: #8b13c4;      /* fastest-lap purple, readable on white */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.5;
    padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 560px;
    margin: 0 auto;
  }
  header { padding: 22px 2px 16px; border-bottom: 1px solid var(--line); }
  h1 {
    font-family: 'Archivo', sans-serif;
    font-stretch: 75%;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }

  nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 16px 0; }
  nav button {
    font-family: 'Archivo', sans-serif;
    font-stretch: 75%;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: left;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 6px;
    padding: 12px 12px;
    cursor: pointer;
    min-height: 58px;
    transition: border-color 0.15s;
  }
  nav button small { display: block; color: var(--dim); font-weight: 500; font-size: 11px; text-transform: none; letter-spacing: 0; margin-top: 2px; }
  nav button:active, nav button.active { border-left-color: var(--accent); background: var(--panel-2); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #status { color: var(--dim); font-size: 12px; min-height: 18px; padding: 2px; }
  #status .blink { color: var(--accent); }

  #out { margin-top: 8px; }
  .section-title {
    font-family: 'Archivo', sans-serif;
    font-stretch: 75%;
    font-weight: 700;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin: 20px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 12px;
    margin-bottom: 6px;
  }
  .row .pos { color: var(--accent); font-weight: 600; min-width: 2ch; }
  .row .name { flex: 1; }
  .row .val { font-weight: 600; }
  .row .detail { display: block; color: var(--dim); font-size: 11px; }
  .val.up { color: var(--up); }
  .val.down { color: var(--down); }
  .note { color: var(--dim); font-size: 12px; margin: 10px 2px; }
  .err { color: var(--down); font-size: 13px; margin: 12px 2px; }
  details.row { display: block; padding: 0; }
  details.row summary {
    display: flex; align-items: baseline; gap: 10px; padding: 9px 12px;
    cursor: pointer; list-style: none;
  }
  details.row summary::-webkit-details-marker { display: none; }
  details.row summary::after { content: "▾"; color: var(--dim); font-size: 11px; align-self: center; }
  details.row[open] summary::after { content: "▴"; }
  .rounds-wrap { border-top: 1px solid var(--line); padding: 8px 12px 10px; }
  .spark { width: 100%; height: 40px; display: block; margin-bottom: 6px; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .spark line.zero { stroke: var(--line); stroke-width: 1; }
  .rounds { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 4px 10px; }
  .rounds span { font-size: 11px; color: var(--dim); }
  .rounds b { font-weight: 600; color: var(--text); margin-left: 5px; }
  .rounds b.neg { color: var(--down); }
  .row input {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font: inherit; width: 84px; padding: 4px 8px; border-radius: 4px; text-align: right;
  }
  #importBox textarea {
    width: 100%; min-height: 90px; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); font: 12px 'JetBrains Mono', monospace; padding: 8px; border-radius: 6px;
    resize: vertical; margin: 6px 0;
  }
  #importBox textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input.own { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; flex: none; cursor: pointer; }
  .dash-hero { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 14px 16px; margin: 6px 0 4px; }
  .dash-hero .dh-phase { font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 700; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
  .dash-hero .dh-race { font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 800; font-size: 22px;
    text-transform: uppercase; margin: 3px 0 2px; }
  .dash-hero .dh-when { color: var(--dim); font-size: 13px; }
  .dash-hero .dh-when b { color: var(--text); }
  .dash-hero button { margin: 12px 0 0; }
  button.optimize.secondary { background: var(--panel-2); color: var(--text); }
  input.tune-in { background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font: inherit; width: 90px; padding: 4px 8px; border-radius: 4px; text-align: right; }
  input.tune-in:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.optimize {
    font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.04em;
    width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; cursor: pointer;
    background: var(--accent); border: none; color: #fff;
  }

  /* ---- live timing ---- */
  .lt-head { display: flex; align-items: center; gap: 10px; margin: 16px 0 6px; flex-wrap: wrap; }
  .lt-title { font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 800; font-size: 18px;
    text-transform: uppercase; letter-spacing: 0.02em; }
  .lt-badge { font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 700; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 4px; }
  .lt-badge.live { background: var(--accent); color: #fff; }
  .lt-badge.past { background: var(--panel-2); color: var(--dim); border: 1px solid var(--line); }
  .lt-sub { color: var(--dim); font-size: 12px; width: 100%; }
  .track { width: 100%; height: 240px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 12px; display: block; }
  .track .outline { fill: none; stroke: #c2c2cc; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  .track .sf { stroke: var(--dim); stroke-width: 3; }
  .track .car { stroke: #0a0a0f; stroke-width: 1.5; }
  .track .carnum { fill: #fff; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px;
    text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #0a0a0f; stroke-width: 2.5; }
  .tt-row { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 4px; }
  .tt-row summary { display: grid; grid-template-columns: 2.6em 5px 24px 1fr auto; align-items: center; gap: 7px;
    padding: 7px 10px; cursor: pointer; list-style: none; }
  .tt-row summary::-webkit-details-marker { display: none; }
  .tt-row[open] { border-color: #3a3f4b; }
  .tele { border-top: 1px solid var(--line); padding: 8px 12px 10px; }
  .tele .ch { display: grid; grid-template-columns: 4.5em 1fr 3.5em; align-items: center; gap: 8px; margin-bottom: 5px; }
  .tele .lbl { color: var(--dim); font-size: 11px; }
  .tele .bar2 { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .tele .fill { display: block; height: 100%; border-radius: 4px; }
  .tele .fill.thr { background: var(--up); }
  .tele .fill.brk { background: var(--down); }
  .tele .v { text-align: right; font-size: 12px; }
  .tele .nums { display: flex; gap: 16px; margin-top: 7px; font-size: 12px; color: var(--dim); }
  .tele .nums b { color: var(--text); font-weight: 600; margin-left: 4px; }
  .tele .na { color: var(--dim); font-size: 12px; }
  .tt-row .p { color: var(--dim); font-weight: 600; text-align: right; }
  .tt-row .bar { width: 4px; height: 22px; border-radius: 2px; }
  .tt-row .who { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .tt-row .acr { font-weight: 600; }
  .tt-row .team { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tt-row .data { display: flex; align-items: center; gap: 10px; font-size: 12px; white-space: nowrap; }
  .tt-row .gap { color: var(--dim); min-width: 6ch; text-align: right; }
  .tt-row .lap { min-width: 8ch; text-align: right; }
  .tt-row .spd { min-width: 6ch; text-align: right; color: var(--text); }
  .tt-row .spd i { color: var(--dim); font-style: normal; font-size: 9px; margin-left: 1px; }
  .tt-row .drs { color: #14161a; background: var(--up); font-weight: 700; font-size: 10px;
    padding: 1px 4px; border-radius: 3px; letter-spacing: 0.03em; }
  .tyre { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    border-radius: 50%; font-size: 10px; font-weight: 700; border: 2px solid; }
  .tyre.S { border-color: #da291c; color: #da291c; }
  .tyre.M { border-color: #c99700; color: #c99700; }   /* amber — plain yellow is invisible on white */
  .tyre.H { border-color: #6b6b76; color: #3a3a3a; }   /* grey — hard is "white", shown dark on white bg */
  .tyre.I { border-color: #2e9e2e; color: #2e9e2e; }
  .tyre.W { border-color: #0067ad; color: #0067ad; }
  .tt-row .p { display: flex; align-items: baseline; gap: 3px; justify-content: flex-end; }
  .tt-row .chg { font-size: 9px; font-weight: 700; }
  .tt-row .chg.up { color: var(--up); }
  .tt-row .chg.dn { color: var(--down); }
  .tt-row .shot { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--panel-2); }
  .tt-row .shot.ph { display: inline-block; }
  .tt-row .fl { color: var(--purple); font-size: 9px; font-weight: 700; margin-left: 4px; }
  .lap.pb-sess { color: var(--purple); }   /* purple: session-fastest */
  .lap.pb-self { color: var(--up); }  /* green: personal best */
  .tele .secs { display: flex; gap: 8px; margin-bottom: 8px; }
  .tele .sec { font-size: 11px; color: var(--dim); background: var(--panel-2); padding: 3px 7px; border-radius: 4px; }
  .tele .sec.pb-sess { color: var(--purple); }
  .tele .sec.pb-self { color: var(--up); }
  .tele .stints { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .tele .st { font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
  .tele .st.S { border-color: #da291c; color: #da291c; }
  .tele .st.M { border-color: #c99700; color: #c99700; }
  .tele .st.H { border-color: #6b6b76; color: #3a3a3a; }
  .tele .st.I { border-color: #2e9e2e; color: #2e9e2e; }
  .tele .team-hd { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  #lt-rc { margin: 4px 0 8px; }
  .rc-title { font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 700; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); margin-bottom: 4px; }
  .rc-msg { display: flex; align-items: baseline; gap: 8px; font-size: 12px; padding: 4px 8px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 4px; margin-bottom: 3px; }
  .rc-msg.yellow { border-left-color: #ffd24a; }
  .rc-msg.red { border-left-color: #ff3b3b; }
  .rc-msg.green { border-left-color: #4ade80; }
  .rc-msg.sc { border-left-color: #ff8a00; }
  .rc-msg.chq { border-left-color: #6b6b76; }
  .rc-lap { color: var(--dim); min-width: 3ch; font-size: 11px; }
  .lt-token { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .lt-token input { flex: 1; min-width: 160px; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); font: inherit; padding: 6px 10px; border-radius: 6px; }
  .lt-token input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lt-token button { width: auto; margin: 0; padding: 7px 14px; }
  .lt-token .note { flex-basis: 100%; margin: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .blink { animation: pulse 1s ease-in-out infinite; }
    .lt-badge.live { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  }
</style>
</head>
<body>

<header>
  <h1 onclick="goDashboard()" title="Back to dashboard" style="cursor:pointer">Pit <span>Wall</span></h1>
  <div class="sub">Live season analysis · data: jolpi.ca (Ergast-compatible)</div>
</header>

<nav aria-label="Analyses">
  <button onclick="run(liveTiming, this)">Live timing<small>Track map &amp; timing tower</small></button>
  <button onclick="run(fantasyTop, this)">Fantasy top 3<small>Drivers &amp; teams, full scoring</small></button>
  <button onclick="run(pitStops, this)">Pit stop pace<small>Fastest avg, drivers &amp; teams</small></button>
  <button onclick="run(overtakes, this)">Overtake trend<small>Positions gained per round</small></button>
  <button onclick="run(formPredictor, this)">Form predictor<small>Fantasy model &amp; momentum trends</small></button>
  <button onclick="run(raceForecast, this)">Race forecast<small>Next races · wet-weather risk</small></button>
  <button onclick="run(backtest, this)">Backtest<small>Method shoot-out + auto-tune</small></button>
  <button onclick="run(teamOptimizer, this)">Team optimizer<small>Best 5+2 &amp; captain pick</small></button>
  <button onclick="run(settings, this)">Settings<small>Model knobs, token, data</small></button>
</nav>

<div id="status" role="status"></div>
<div id="out"></div>

<script>
const API = "https://api.jolpi.ca/ergast/f1";
const cache = new Map();
let latestRound = null;

const out = document.getElementById("out");
const statusEl = document.getElementById("status");

function setStatus(msg, busy) {
  statusEl.innerHTML = busy ? `<span class="blink">●</span> ${msg}` : msg;
}

const CACHE_VER = "pw1:";
function cacheTTL(url) {
  if (url.includes("open-meteo")) return 60 * 60e3; // weather forecasts go stale fast
  if (url.endsWith("/current/driverStandings.json")) return 15 * 60e3; // latest-round probe — keep fresh
  // a completed round's data never changes → cache it effectively forever; the current round
  // (results/quali appear as the weekend unfolds) and anything undated stays fresh.
  const m = url.match(/\/current\/(\d+)\//);
  if (m && latestRound && +m[1] < latestRound) return 60 * 24 * 3600e3; // finished round: 60 days
  return 15 * 60e3;
}

async function fetchCached(url, emptyOn404) {
  if (cache.has(url)) return cache.get(url);
  try {
    const hit = JSON.parse(localStorage.getItem(CACHE_VER + url));
    if (hit && Date.now() - hit.t < cacheTTL(url)) { cache.set(url, hit.d); return hit.d; }
  } catch {}
  let res;
  for (let attempt = 0; ; attempt++) {
    try {
      res = await fetch(url);
    } catch (e) {
      if (attempt >= 3) throw e; // network blip — retry a few times before giving up
      await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
      continue;
    }
    if (res.status !== 429 || attempt >= 3) break;
    await new Promise(r => setTimeout(r, 1000 * (attempt + 1))); // rate-limited — back off
  }
  // OpenF1 says 404 for "query matched nothing" — callers can opt into treating that as empty
  const json = emptyOn404 && res.status === 404 ? [] : null;
  if (json === null && !res.ok) throw new Error("API returned " + res.status);
  const data = json ?? await res.json();
  cache.set(url, data);
  try { localStorage.setItem(CACHE_VER + url, JSON.stringify({ t: Date.now(), d: data })); } catch {}
  return data;
}

// fetch a batch of URLs, 3 in flight at a time (jolpi.ca allows ~4 req/s)
async function fetchAll(urls, label, emptyOn404) {
  const results = new Array(urls.length);
  let next = 0, done = 0;
  async function worker() {
    while (next < urls.length) {
      const i = next++;
      results[i] = await fetchCached(urls[i], emptyOn404);
      setStatus(`${label} ${++done} of ${urls.length}…`, true);
    }
  }
  await Promise.all(Array.from({ length: Math.min(3, urls.length) }, worker));
  return results;
}

async function getLatestRound() {
  if (latestRound) return latestRound;
  const json = await fetchCached(`${API}/current/driverStandings.json`);
  latestRound = parseInt(json.MRData.StandingsTable.round, 10);
  return latestRound;
}

let liveTimer = null;
function stopLive() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

async function run(analysis, btn) {
  stopLive(); // leaving any live-timing poll behind would keep hammering the API
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  out.innerHTML = "";
  try {
    await analysis();
    if (analysis !== liveTiming) setStatus("Done. Data cached — repeat runs are instant.", false);
  } catch (e) {
    setStatus("", false);
    out.innerHTML = `<p class="err">Something went wrong: ${e.message}. Check your connection and try again.</p>`;
  }
}

// ---------- rendering helpers ----------
function title(t) {
  out.insertAdjacentHTML("beforeend", `<div class="section-title">${t}</div>`);
}
function rowHTML(pos, name, val, valClass = "", detail = "") {
  out.insertAdjacentHTML("beforeend",
    `<div class="row"><span class="pos">${pos}</span><span class="name">${name}${detail ? `<span class="detail">${detail}</span>` : ""}</span><span class="val ${valClass}">${val}</span></div>`);
}
function note(t) {
  out.insertAdjacentHTML("beforeend", `<p class="note">${t}</p>`);
}
function pct(v) { return (v >= 0 ? "+" : "") + v.toFixed(1) + "%"; }

function sparkline(vals) {
  if (vals.length < 2) return "";
  const w = 240, h = 40, min = Math.min(...vals, 0), max = Math.max(...vals, 1);
  const x = i => 4 + (i / (vals.length - 1)) * (w - 8);
  const y = v => h - 5 - ((v - min) / (max - min || 1)) * (h - 10);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`
    + (min < 0 ? `<line class="zero" x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}"/>` : "")
    + `<polyline points="${vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ")}"/></svg>`;
}

// ---------- flags ----------
const NAT_CC = { British: "GB", Dutch: "NL", Monegasque: "MC", Spanish: "ES", Mexican: "MX",
  German: "DE", French: "FR", Finnish: "FI", Australian: "AU", Canadian: "CA", Japanese: "JP",
  Chinese: "CN", Thai: "TH", Danish: "DK", Italian: "IT", American: "US", Brazilian: "BR",
  Argentine: "AR", Argentinian: "AR", "New Zealander": "NZ", Swiss: "CH", Swedish: "SE",
  Belgian: "BE", Austrian: "AT", Polish: "PL", Russian: "RU", Estonian: "EE", Colombian: "CO",
  Indonesian: "ID", Irish: "IE" };
const COUNTRY_CC = { Belgium: "BE", Hungary: "HU", Netherlands: "NL", Italy: "IT", UK: "GB",
  USA: "US", "United States": "US", Monaco: "MC", Spain: "ES", Canada: "CA", Austria: "AT",
  France: "FR", Azerbaijan: "AZ", Singapore: "SG", Japan: "JP", China: "CN", Mexico: "MX",
  Brazil: "BR", UAE: "AE", "Saudi Arabia": "SA", Bahrain: "BH", Qatar: "QA", Australia: "AU",
  Germany: "DE", Portugal: "PT", Turkey: "TR", Russia: "RU", Korea: "KR", "South Korea": "KR",
  India: "IN", Malaysia: "MY", "South Africa": "ZA", Argentina: "AR", Vietnam: "VN" };

function isoFlag(cc) {
  return cc.toUpperCase().replace(/./g, c => String.fromCodePoint(0x1F1A5 + c.charCodeAt(0)));
}

const driverFlags = new Map();
function noteFlag(driver) {
  const cc = NAT_CC[driver.nationality];
  if (cc && !driverFlags.has(driver.familyName)) driverFlags.set(driver.familyName, isoFlag(cc));
}
function dn(name) { // driver name with nationality flag
  const f = driverFlags.get(name);
  return f ? `${f} ${name}` : name;
}
function countryFlag(country) {
  const cc = COUNTRY_CC[country];
  return cc ? isoFlag(cc) + " " : "";
}

// ---------- shared data loaders ----------
async function loadAllResults(last) {
  const urls = [];
  for (let r = 1; r <= last; r++) urls.push(`${API}/current/${r}/results.json?limit=40`);
  const jsons = await fetchAll(urls, "Fetching results");
  return jsons.map(j => j.MRData.RaceTable.Races[0]?.Results ?? []);
}
